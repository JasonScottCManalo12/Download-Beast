name: Download Beast CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-beast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner scaffolding
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name download_beast bootstrap
          Copy-Item -Path bootstrap/windows -Destination windows -Recurse
          Remove-Item bootstrap -Recurse -Force

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Name Windows executable
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "download_beast.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected Flutter executable not found: $exe"
          }
          Rename-Item -Path $exe -NewName "Download Beast.exe"
          if (-not (Test-Path (Join-Path $releaseDir "Download Beast.exe"))) {
            throw "Renamed executable was not found."
          }

      - name: Upload Windows application package
        uses: actions/upload-artifact@v4
        with:
          name: Download-Beast-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

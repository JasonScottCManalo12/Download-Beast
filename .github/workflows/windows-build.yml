name: Download Beast CI

on:
  push:
    branches: ["experiment/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-beast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Record toolchain
        run: flutter --version

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test --concurrency=1 --reporter expanded

  build-windows:
    name: Build and validate portable Windows ZIP
    runs-on: windows-2022
    needs: verify
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Record toolchain
        run: flutter --version

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create portable ZIP, manifest, and notices
        shell: pwsh
        run: |
          & ./tool/package_windows.ps1 `
            -ReleaseDirectory "build/windows/x64/runner/Release" `
            -OutputDirectory "build/package" `
            -FlutterRoot $env:FLUTTER_ROOT

      - name: Independently verify package and checksum
        shell: pwsh
        run: |
          & ./tool/verify_windows_package.ps1 -PackageDirectory "build/package"

      - name: Upload validated Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Download-Beast-Windows
          path: |
            build/package/Download-Beast-Windows.zip
            build/package/Download-Beast-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 14
